name: MusiclabWorker
options:
  bundleIdPrefix: info.jetsons
  deploymentTarget:
    # @Observable needs 14. Every Apple silicon Mac runs well past it, so this
    # costs no hardware that could have joined the swarm.
    macOS: "14.0"
  createIntermediateGroups: true

schemes:
  MusiclabWorker:
    build:
      targets:
        MusiclabWorker: all
    run:
      config: Debug

targets:
  MusiclabWorker:
    type: application
    platform: macOS
    sources:
      - path: MusiclabWorker
      # The state vocabulary, shared verbatim with the iOS app and mirroring
      # stems/states.py. Compiled, not copied: a second copy is a second
      # vocabulary waiting to drift.
      - path: ../shared/States.swift
    info:
      path: MusiclabWorker/Info.plist
      properties:
        CFBundleName: Musiclab Worker
        CFBundleDisplayName: Musiclab Worker
        # Lives in the menu bar, so no Dock icon and no window on launch.
        LSUIElement: true
        NSHumanReadableCopyright: ""
        # Where this checkout's interpreter is, filled in from a build
        # setting only Debug defines. An Xcode build carries no Python of its
        # own -- packaging is what adds one -- so without this, Run starts the
        # app and no worker, silently. Empty in Release, where the bundled
        # interpreter is the only one that should ever be used.
        MusiclabDevelopmentPython: $(MUSICLAB_DEV_PYTHON)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.jetsons.musiclab.worker
        PRODUCT_NAME: Musiclab Worker
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: MusiclabWorker.entitlements
      configs:
        Debug:
          MUSICLAB_DEV_PYTHON: $(SRCROOT)/../.venv/bin/python
