[project]
name = "stems"
version = "0.1.0"
description = "YouTube link in, multitrack music stems out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.1.15",
    "audio-separator[cpu]>=0.30.0",
    # librosa reaches for audioread at import time, but audio-separator's
    # dependency chain does not pull it in on its own.
    "audioread>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "numpy>=1.26",
    # Advertises the server over Bonjour so the iOS app finds the Mac itself.
    "zeroconf>=0.140",
]

[project.scripts]
stems = "stems.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stems"]
