[project]
name = "stems"
version = "0.1.0"
description = "YouTube link in, multitrack music stems out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "yt-dlp>=2025.1.15",
    "audio-separator[cpu]>=0.30.0",
    # librosa reaches for audioread at import time, but audio-separator's
    # dependency chain does not pull it in on its own.
    "audioread>=3.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
    "soundfile>=0.13",
    "numpy>=1.26",
    # Advertises the server over Bonjour so the iOS app finds the Mac itself.
    "zeroconf>=0.140",
    # Verifies Sign in with Apple identity tokens against Apple's public keys.
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
# Everything a swarm worker needs, and nothing the server needs. Notably no
# FastAPI: a worker talks to a server, it does not host one.
worker = [
    "yt-dlp>=2025.1.15",
    "audio-separator[cpu]>=0.30.0",
    "audioread>=3.0",
    "soundfile>=0.13",
    "numpy>=1.26",
    # ffmpeg as a wheel, so a packaged worker needs no Homebrew.
    "imageio-ffmpeg>=0.5",
]
# Deploying to Modal; not needed to run the server on the Mac.
modal = ["modal>=1.5"]

[project.scripts]
stems = "stems.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stems"]
