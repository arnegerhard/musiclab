name: Musiclab
options:
  bundleIdPrefix: info.jetsons
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Musiclab:
    type: application
    platform: iOS
    sources:
      - path: Musiclab
    entitlements:
      path: Musiclab/Musiclab.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    info:
      path: Musiclab/Info.plist
      properties:
        CFBundleDisplayName: Musiclab
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Playback must survive the screen locking: this is a listening app.
        UIBackgroundModes:
          - audio
        # Bonjour discovery of the Mac running the separation server.
        NSLocalNetworkUsageDescription: >-
          Musiclab looks for your Mac on the local network to load separated tracks.
        NSBonjourServices:
          - _stems._tcp
        # Reading playlists and track metadata from the local music library.
        NSAppleMusicUsageDescription: >-
          Musiclab reads your playlists so you can choose which songs to split
          into separate tracks.
        # Spotify sends the OAuth result back to this scheme.
        # Where TestFlight and App Store builds look. Development builds try
        # the Mac first and fall back to this.
        MusiclabCloudURL: $(MUSICLAB_CLOUD_URL)
        CFBundleURLTypes:
          - CFBundleURLName: info.jetsons.musiclab
            CFBundleURLSchemes:
              - musiclab
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.jetsons.musiclab
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Override per build (or in CI) without touching source.
        MUSICLAB_CLOUD_URL: https://stems.jetsons.info
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
